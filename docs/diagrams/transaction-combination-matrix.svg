<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1500" viewBox="0 0 2100 1500" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder Seal Transaction Combination Matrix</title>
  <desc id="desc">Matrix listing all modeled transaction actor pairs, channels, primitives, use cases, advantages, and production boundaries.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475467; }
      .table { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 18; }
      .head { fill: #1f4e79; }
      .head-text { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .cell-text { font: 400 12px Arial, sans-serif; fill: #344054; }
      .flow { font: 700 12px Arial, sans-serif; fill: #101828; }
      .pair { font: 700 13px Arial, sans-serif; fill: #1f4e79; }
      .row-a { fill: #ffffff; }
      .row-b { fill: #f9fafb; }
      .line { stroke: #e4e7ec; stroke-width: 1; }
      .vline { stroke: #d0d5dd; stroke-width: 1.2; }
      .badge { fill: #edf7f0; stroke: #2f7d45; rx: 8; }
      .badge2 { fill: #fff7e6; stroke: #b26a00; rx: 8; }
      .badge3 { fill: #eef6ff; stroke: #2e73b8; rx: 8; }
      .small { font: 400 11px Arial, sans-serif; fill: #475467; }
    </style>
  </defs>

  <rect class="bg" width="2100" height="1500"/>
  <text class="title" x="56" y="58">Transaction Combination Matrix</text>
  <text class="subtitle" x="56" y="88">All modeled actor-pair combinations in the current Cylinder Seal design surface.</text>

  <rect class="table" x="48" y="125" width="2004" height="1260"/>
  <rect class="head" x="48" y="125" width="2004" height="56" rx="18"/>
  <rect class="head" x="48" y="153" width="2004" height="28"/>

  <text class="head-text" x="78" y="160">Flow</text>
  <text class="head-text" x="160" y="160">Pair</text>
  <text class="head-text" x="280" y="160">Channels</text>
  <text class="head-text" x="540" y="160">Primitive / settlement mode</text>
  <text class="head-text" x="890" y="160">Use case</text>
  <text class="head-text" x="1245" y="160">Main advantage</text>
  <text class="head-text" x="1660" y="160">Boundary</text>

  <line class="vline" x1="130" y1="125" x2="130" y2="1385"/>
  <line class="vline" x1="250" y1="125" x2="250" y2="1385"/>
  <line class="vline" x1="510" y1="125" x2="510" y2="1385"/>
  <line class="vline" x1="860" y1="125" x2="860" y2="1385"/>
  <line class="vline" x1="1215" y1="125" x2="1215" y2="1385"/>
  <line class="vline" x1="1630" y1="125" x2="1630" y2="1385"/>

  <g>
    <rect class="row-a" x="48" y="181" width="2004" height="64"/>
    <text class="flow" x="80" y="218">1</text><text class="pair" x="160" y="218">C2C</text>
    <text class="cell-text" x="280" y="207">Online, QR, NFC, BLE</text>
    <text class="cell-text" x="540" y="207">Standard, offline pending, refund</text>
    <text class="cell-text" x="890" y="207">Family remittance, informal debt, peer support</text>
    <text class="cell-text" x="1245" y="207">Documents cash-like activity and builds history</text>
    <text class="cell-text" x="1660" y="207">Secure offline attestation still required</text>
  </g>
  <line class="line" x1="48" y1="245" x2="2052" y2="245"/>

  <g>
    <rect class="row-b" x="48" y="245" width="2004" height="64"/>
    <text class="flow" x="80" y="282">2</text><text class="pair" x="160" y="282">C2M</text>
    <text class="cell-text" x="280" y="271">Online, QR, NFC, BLE</text>
    <text class="cell-text" x="540" y="271">Standard, offline pending, refund</text>
    <text class="cell-text" x="890" y="271">Retail checkout at formal merchant</text>
    <text class="cell-text" x="1245" y="271">Low-friction acceptance and merchant credit data</text>
    <text class="cell-text" x="1660" y="271">Merchant onboarding and device trust needed</text>
  </g>
  <line class="line" x1="48" y1="309" x2="2052" y2="309"/>

  <g>
    <rect class="row-a" x="48" y="309" width="2004" height="64"/>
    <text class="flow" x="80" y="346">3</text><text class="pair" x="160" y="346">C2IP</text>
    <text class="cell-text" x="280" y="335">Online, QR, NFC, BLE</text>
    <text class="cell-text" x="540" y="335">Standard, offline pending</text>
    <text class="cell-text" x="890" y="335">Taxi, market stall, home-food producer, farmer</text>
    <text class="cell-text" x="1245" y="335">Documents informal income without full company setup</text>
    <text class="cell-text" x="1660" y="335">IP caps, tax rules, and verification required</text>
  </g>
  <line class="line" x1="48" y1="373" x2="2052" y2="373"/>

  <g>
    <rect class="row-b" x="48" y="373" width="2004" height="64"/>
    <text class="flow" x="80" y="410">4</text><text class="pair" x="160" y="410">IP2M</text>
    <text class="cell-text" x="280" y="399">Online, QR</text>
    <text class="cell-text" x="540" y="399">Standard, constrained if subsidized</text>
    <text class="cell-text" x="890" y="399">Informal producer buys supplier inputs</text>
    <text class="cell-text" x="1245" y="399">Creates supply-chain evidence for microcredit</text>
    <text class="cell-text" x="1660" y="399">High-value offline supplier flows should be capped</text>
  </g>
  <line class="line" x1="48" y1="437" x2="2052" y2="437"/>

  <g>
    <rect class="row-a" x="48" y="437" width="2004" height="64"/>
    <text class="flow" x="80" y="474">5</text><text class="pair" x="160" y="474">M2C</text>
    <text class="cell-text" x="280" y="463">Online</text>
    <text class="cell-text" x="540" y="463">Refund, rebate, wage, compensation</text>
    <text class="cell-text" x="890" y="463">Customer refunds, payroll, compensation</text>
    <text class="cell-text" x="1245" y="463">Auditable reversal without deleting history</text>
    <text class="cell-text" x="1660" y="463">Consumer-protection rules required</text>
  </g>
  <line class="line" x1="48" y1="501" x2="2052" y2="501"/>

  <g>
    <rect class="row-b" x="48" y="501" width="2004" height="64"/>
    <text class="flow" x="80" y="538">6</text><text class="pair" x="160" y="538">M2M</text>
    <text class="cell-text" x="280" y="527">Online, batch</text>
    <text class="cell-text" x="540" y="527">Standard, invoice escrow, spend constraint</text>
    <text class="cell-text" x="890" y="527">Supplier invoice and distributor payment</text>
    <text class="cell-text" x="1245" y="527">Turns B2B cash flow into credit evidence</text>
    <text class="cell-text" x="1660" y="527">Invoice dispute workflow required</text>
  </g>
  <line class="line" x1="48" y1="565" x2="2052" y2="565"/>

  <g>
    <rect class="row-a" x="48" y="565" width="2004" height="64"/>
    <text class="flow" x="80" y="602">7</text><text class="pair" x="160" y="602">G2C</text>
    <text class="cell-text" x="280" y="591">Government batch, wallet</text>
    <text class="cell-text" x="540" y="591">Standard, expiring, spend constraint</text>
    <text class="cell-text" x="890" y="591">Salary, pension, social, stimulus</text>
    <text class="cell-text" x="1245" y="591">Auditable transfer with optional targeting</text>
    <text class="cell-text" x="1660" y="591">Legal authority and privacy review required</text>
  </g>
  <line class="line" x1="48" y1="629" x2="2052" y2="629"/>

  <g>
    <rect class="row-b" x="48" y="629" width="2004" height="64"/>
    <text class="flow" x="80" y="666">8</text><text class="pair" x="160" y="666">G2M</text>
    <text class="cell-text" x="280" y="655">Government batch, online</text>
    <text class="cell-text" x="540" y="655">Spend constraint, release escrow</text>
    <text class="cell-text" x="890" y="655">Procurement and domestic-content programs</text>
    <text class="cell-text" x="1245" y="655">Public demand becomes traceable to suppliers</text>
    <text class="cell-text" x="1660" y="655">Procurement law and appeals required</text>
  </g>
  <line class="line" x1="48" y1="693" x2="2052" y2="693"/>

  <g>
    <rect class="row-a" x="48" y="693" width="2004" height="64"/>
    <text class="flow" x="80" y="730">9</text><text class="pair" x="160" y="730">C2G</text>
    <text class="cell-text" x="280" y="719">Online, batch</text>
    <text class="cell-text" x="540" y="719">Standard, recurring debit</text>
    <text class="cell-text" x="890" y="719">Fees, fines, taxes, utility bills</text>
    <text class="cell-text" x="1245" y="719">Reduces cash handling and improves receipts</text>
    <text class="cell-text" x="1660" y="719">Treasury integration required</text>
  </g>
  <line class="line" x1="48" y1="757" x2="2052" y2="757"/>

  <g>
    <rect class="row-b" x="48" y="757" width="2004" height="64"/>
    <text class="flow" x="80" y="794">10</text><text class="pair" x="160" y="794">M2G</text>
    <text class="cell-text" x="280" y="783">Online, batch, auto split</text>
    <text class="cell-text" x="540" y="783">Tax or fee split, report trigger</text>
    <text class="cell-text" x="890" y="783">VAT-like fee, presumptive tax, withholding</text>
    <text class="cell-text" x="1245" y="783">Passive collection with lower filing burden</text>
    <text class="cell-text" x="1660" y="783">Tax authority integration and recourse needed</text>
  </g>
  <line class="line" x1="48" y1="821" x2="2052" y2="821"/>

  <g>
    <rect class="row-a" x="48" y="821" width="2004" height="64"/>
    <text class="flow" x="80" y="858">11</text><text class="pair" x="160" y="858">B2C</text>
    <text class="cell-text" x="280" y="847">Online</text>
    <text class="cell-text" x="540" y="847">Earmarked loan, release escrow, recurring setup</text>
    <text class="cell-text" x="890" y="847">Consumer loan, mortgage, education finance</text>
    <text class="cell-text" x="1245" y="847">Loan proceeds can be purpose-restricted</text>
    <text class="cell-text" x="1660" y="847">Bank licensing and disclosure required</text>
  </g>
  <line class="line" x1="48" y1="885" x2="2052" y2="885"/>

  <g>
    <rect class="row-b" x="48" y="885" width="2004" height="64"/>
    <text class="flow" x="80" y="922">12</text><text class="pair" x="160" y="922">C2B</text>
    <text class="cell-text" x="280" y="911">Online, recurring</text>
    <text class="cell-text" x="540" y="911">Repayment, auto-debit, refinance settlement</text>
    <text class="cell-text" x="890" y="911">Loan or mortgage repayment</text>
    <text class="cell-text" x="1245" y="911">Stable repayment history improves scoring</text>
    <text class="cell-text" x="1660" y="911">Debt-service caps and consent controls needed</text>
  </g>
  <line class="line" x1="48" y1="949" x2="2052" y2="949"/>

  <g>
    <rect class="row-a" x="48" y="949" width="2004" height="64"/>
    <text class="flow" x="80" y="986">13</text><text class="pair" x="160" y="986">B2M</text>
    <text class="cell-text" x="280" y="975">Online, batch</text>
    <text class="cell-text" x="540" y="975">Invoice finance, working-capital escrow</text>
    <text class="cell-text" x="890" y="975">SME working capital and industrial finance</text>
    <text class="cell-text" x="1245" y="975">Reduces collateral dependence through cash-flow data</text>
    <text class="cell-text" x="1660" y="975">Bank risk-model validation required</text>
  </g>
  <line class="line" x1="48" y1="1013" x2="2052" y2="1013"/>

  <g>
    <rect class="row-b" x="48" y="1013" width="2004" height="64"/>
    <text class="flow" x="80" y="1050">14</text><text class="pair" x="160" y="1050">M2B</text>
    <text class="cell-text" x="280" y="1039">Online, batch</text>
    <text class="cell-text" x="540" y="1039">Repayment, invoice settlement, deposit sweep</text>
    <text class="cell-text" x="890" y="1039">Merchant loan repayment or sweep</text>
    <text class="cell-text" x="1245" y="1039">Gives lenders real cash-flow visibility</text>
    <text class="cell-text" x="1660" y="1039">Deposit and settlement rules required</text>
  </g>
  <line class="line" x1="48" y1="1077" x2="2052" y2="1077"/>

  <g>
    <rect class="row-a" x="48" y="1077" width="2004" height="64"/>
    <text class="flow" x="80" y="1114">15</text><text class="pair" x="160" y="1114">D2M</text>
    <text class="cell-text" x="280" y="1103">Merchant QR, bridge</text>
    <text class="cell-text" x="540" y="1103">Standard, FX-tagged receipt, refund</text>
    <text class="cell-text" x="890" y="1103">Diaspora purchase, tourism, pilgrimage service</text>
    <text class="cell-text" x="1245" y="1103">Captures external demand in merchant cash flow</text>
    <text class="cell-text" x="1660" y="1103">Future regulated cross-border and FX integration</text>
  </g>
  <line class="line" x1="48" y1="1141" x2="2052" y2="1141"/>

  <g>
    <rect class="row-b" x="48" y="1141" width="2004" height="64"/>
    <text class="flow" x="80" y="1178">16</text><text class="pair" x="160" y="1178">CBI2B</text>
    <text class="cell-text" x="280" y="1167">Bank batch</text>
    <text class="cell-text" x="540" y="1167">Liquidity allocation, policy instruction</text>
    <text class="cell-text" x="890" y="1167">Liquidity or program funding to banks</text>
    <text class="cell-text" x="1245" y="1167">Separates policy funding from retail disbursement</text>
    <text class="cell-text" x="1660" y="1167">CBI and core-banking integration required</text>
  </g>
  <line class="line" x1="48" y1="1205" x2="2052" y2="1205"/>

  <g>
    <rect class="row-a" x="48" y="1205" width="2004" height="64"/>
    <text class="flow" x="80" y="1242">17</text><text class="pair" x="160" y="1242">B2CBI</text>
    <text class="cell-text" x="280" y="1231">Bank batch</text>
    <text class="cell-text" x="540" y="1231">Settlement, reserve movement, report</text>
    <text class="cell-text" x="890" y="1231">Bank settlement and supervisory reporting</text>
    <text class="cell-text" x="1245" y="1231">Supports monetary oversight and reconciliation</text>
    <text class="cell-text" x="1660" y="1231">Production settlement rails required</text>
  </g>
  <line class="line" x1="48" y1="1269" x2="2052" y2="1269"/>

  <g>
    <rect class="row-b" x="48" y="1269" width="2004" height="64"/>
    <text class="flow" x="80" y="1306">18</text><text class="pair" x="160" y="1306">Any</text>
    <text class="cell-text" x="280" y="1295">Online action, synced evidence</text>
    <text class="cell-text" x="540" y="1295">Freeze, cap, reject, report, compensate</text>
    <text class="cell-text" x="890" y="1295">Emergency directive, AML hold, fraud response</text>
    <text class="cell-text" x="1245" y="1295">Supervisory control without mutating history</text>
    <text class="cell-text" x="1660" y="1295">Strict powers, audit, and due process needed</text>
  </g>

  <rect class="badge3" x="78" y="1407" width="510" height="42"/>
  <text class="small" x="100" y="1433">Offline allowed mainly for low-value C2C, C2M, C2IP, and selected IP2M flows.</text>
  <rect class="badge2" x="632" y="1407" width="610" height="42"/>
  <text class="small" x="654" y="1433">Escrow and spend constraints require online finality for high-value release events.</text>
  <rect class="badge" x="1288" y="1407" width="650" height="42"/>
  <text class="small" x="1310" y="1433">Refunds and reversals are compensating entries; committed ledger history is not deleted.</text>
</svg>
