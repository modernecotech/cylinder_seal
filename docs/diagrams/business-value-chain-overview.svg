<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder Seal Business Value Chain Overview</title>
  <desc id="desc">Overview chart showing how capital, facility recycling, sector production, markets, cash waterfalls, and public benefits connect in the Cylinder Seal economic model.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475467; }
      .zone { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .box { stroke-width: 1.8; }
      .capital { fill: #fff7e6; stroke: #b26a00; }
      .evidence { fill: #eef6ff; stroke: #2e73b8; }
      .facility { fill: #f3e8ff; stroke: #7e3fb2; }
      .sector { fill: #e9f7ef; stroke: #2f7d45; }
      .market { fill: #f0f9ff; stroke: #1677a3; }
      .cash { fill: #fff0f0; stroke: #b23b3b; }
      .benefit { fill: #edf7f0; stroke: #2f7d45; }
      .label { font: 700 17px Arial, sans-serif; fill: #101828; }
      .text { font: 400 13px Arial, sans-serif; fill: #344054; }
      .small { font: 400 11.5px Arial, sans-serif; fill: #475467; }
      .arrow { stroke: #344054; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #667085; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect class="bg" width="1900" height="1220"/>
  <text class="title" x="56" y="58">Business Value Chain Overview</text>
  <text class="subtitle" x="56" y="88">The model is a gated productive-capital circuit: capital enters, assets are rehabilitated or built, sectors sell goods and services, cash funds the state and citizens, and benefits are measured separately.</text>

  <rect class="zone" x="48" y="130" width="1804" height="930" rx="24"/>

  <rect class="box capital" x="86" y="205" width="250" height="145" rx="14"/>
  <text class="label" x="112" y="238">Capital Sources</text>
  <text class="text" x="112" y="268">Oil equity allocation</text>
  <text class="text" x="112" y="290">MDB and concessional loans</text>
  <text class="text" x="112" y="312">ECA and supplier finance</text>
  <text class="text" x="112" y="334">PPP, domestic bonds, sukuk</text>

  <rect class="box evidence" x="86" y="430" width="250" height="145" rx="14"/>
  <text class="label" x="112" y="463">Digital IQD Evidence</text>
  <text class="text" x="112" y="493">Contracts, invoices, receipts</text>
  <text class="text" x="112" y="515">KYC, AML, tier data</text>
  <text class="text" x="112" y="537">Settlement and audit trails</text>
  <text class="text" x="112" y="559">Credit and dashboard features</text>

  <rect class="box facility" x="430" y="205" width="300" height="370" rx="14"/>
  <text class="label" x="462" y="240">Brownfield-First Gate</text>
  <text class="text" x="462" y="270">1. Inventory existing facilities</text>
  <text class="text" x="462" y="295">2. Audit title and condition</text>
  <text class="text" x="462" y="320">3. Price environmental liabilities</text>
  <text class="text" x="462" y="345">4. Compare rehab vs greenfield</text>
  <text class="text" x="462" y="370">5. Prove revenue, DSCR, FX cover</text>
  <text class="text" x="462" y="395">6. Pick finance lane</text>
  <text class="small" x="462" y="435">Failed gates: restructure, public rehab,</text>
  <text class="small" x="462" y="455">concession, greenfield review, or reject.</text>
  <text class="small" x="462" y="495">No dividends from asset revaluation.</text>
  <text class="small" x="462" y="515">Only collected operating surplus can pay.</text>

  <rect class="box sector" x="835" y="155" width="350" height="625" rx="14"/>
  <text class="label" x="868" y="190">Sector Production System</text>
  <text class="text" x="868" y="225">Materials, cement, glass, steel</text>
  <text class="text" x="868" y="250">Petrochemicals, fertilizers, plastics</text>
  <text class="text" x="868" y="275">Food, cold chain, agro-processing</text>
  <text class="text" x="868" y="300">Water, desalination, irrigation</text>
  <text class="text" x="868" y="325">Electronics, HVAC, controls</text>
  <text class="text" x="868" y="350">Mobility, machinery, tires, spares</text>
  <text class="text" x="868" y="375">Pharma and medical supplies</text>
  <text class="text" x="868" y="400">Packaging, paper, furniture, rubber</text>
  <text class="text" x="868" y="425">Green power, grid, efficiency</text>
  <text class="text" x="868" y="450">Rail, metro, logistics, depots</text>
  <text class="text" x="868" y="475">Tourism, hospitality, heritage</text>
  <text class="text" x="868" y="500">Digital, telecom, SME platforms</text>
  <text class="text" x="868" y="525">Precious-metals formalization</text>
  <text class="text" x="868" y="550">Strategic controlled sustainment</text>
  <text class="small" x="868" y="595">Each sector must pass cost, quality,</text>
  <text class="small" x="868" y="615">local-content, audit, and finance gates.</text>
  <text class="small" x="868" y="655">Privileges expire unless performance</text>
  <text class="small" x="868" y="675">is proven by transaction evidence.</text>

  <rect class="box market" x="1290" y="185" width="300" height="260" rx="14"/>
  <text class="label" x="1322" y="220">Customers And Markets</text>
  <text class="text" x="1322" y="250">Public procurement</text>
  <text class="text" x="1322" y="275">Households and SMEs</text>
  <text class="text" x="1322" y="300">Industrial projects</text>
  <text class="text" x="1322" y="325">Tourists and diaspora</text>
  <text class="text" x="1322" y="350">Regional export channels</text>
  <text class="small" x="1322" y="392">Demand is useful only when it</text>
  <text class="small" x="1322" y="412">settles as revenue or taxes.</text>

  <rect class="box cash" x="1290" y="525" width="300" height="255" rx="14"/>
  <text class="label" x="1322" y="560">Cash Waterfall</text>
  <text class="text" x="1322" y="590">Operating revenue</text>
  <text class="text" x="1322" y="615">Maintenance and renewal reserve</text>
  <text class="text" x="1322" y="640">Project debt service</text>
  <text class="text" x="1322" y="665">Gross-profit levy and taxes</text>
  <text class="text" x="1322" y="690">Retained earnings</text>
  <text class="text" x="1322" y="715">Dividend stabilization reserve</text>
  <text class="text" x="1322" y="740">Citizen dividend pool</text>

  <rect class="box benefit" x="430" y="835" width="1160" height="175" rx="14"/>
  <text class="label" x="462" y="872">Public Benefit Ledger</text>
  <text class="text" x="462" y="905">Import substitution, FX savings, avoided fuel cost, lower congestion, safer water, reduced spoilage, tourism second-order effects, jobs, SME bankability, and stronger city services.</text>
  <text class="text" x="462" y="940">These are measured and source-tagged, but they do not fund debt or dividends until converted into booked cash through sales, fees, taxes, leases, contracts, or settlements.</text>
  <text class="small" x="462" y="982">This separation is the anti-overclaim rule: economic benefits can justify strategy, while booked cash pays obligations.</text>

  <rect class="box evidence" x="1660" y="330" width="145" height="300" rx="14"/>
  <text class="label" x="1684" y="365">Gates</text>
  <text class="small" x="1684" y="395">Legal</text>
  <text class="small" x="1684" y="420">Fiscal</text>
  <text class="small" x="1684" y="445">Debt</text>
  <text class="small" x="1684" y="470">Revenue</text>
  <text class="small" x="1684" y="495">FX</text>
  <text class="small" x="1684" y="520">Audit</text>
  <text class="small" x="1684" y="545">Privacy</text>
  <text class="small" x="1684" y="570">Anti-capture</text>
  <text class="small" x="1684" y="595">Citizen fairness</text>

  <path class="arrow" d="M336 278 L430 278"/>
  <path class="arrow" d="M336 502 L430 502"/>
  <path class="arrow" d="M730 390 L835 390"/>
  <path class="arrow" d="M1185 315 L1290 315"/>
  <path class="arrow" d="M1440 445 L1440 525"/>
  <path class="arrow" d="M1290 680 L1185 680"/>
  <path class="arrow-soft" d="M1010 780 L1010 835"/>
  <path class="arrow-soft" d="M1590 315 L1660 455"/>
  <path class="arrow-soft" d="M1590 650 L1660 540"/>

  <text class="small" x="86" y="1115">Business reading: every sector must show a real input base, a production process, paying customers, collectible revenue, and a public-benefit trail that is not confused with distributable cash.</text>
</svg>
