  <text class="box-text" x="1194" y="278">Policy authority and operating rules</text>

  <rect class="box external" x="1170" y="318" width="330" height="66"/>
  <text class="box-title" x="1194" y="344">Commercial banks</text>
  <text class="box-text" x="1194" y="366">Core banking, lending, settlement</text>

  <rect class="box external" x="1170" y="406" width="330" height="66"/>
  <text class="box-title" x="1194" y="432">National ID / KYC</text>
  <text class="box-text" x="1194" y="454">Identity, business registry, recovery</text>

  <rect class="box external" x="1170" y="494" width="330" height="66"/>
  <text class="box-title" x="1194" y="520">HSM / secure element</text>
  <text class="box-text" x="1194" y="542">Key custody and device attestation</text>

  <rect class="box external" x="1170" y="582" width="330" height="66"/>
  <text class="box-title" x="1194" y="608">Sanctions, FX, market feeds</text>
  <text class="box-text" x="1194" y="630">Risk and reference data</text>

  <rect class="box external" x="1170" y="670" width="330" height="66"/>
  <text class="box-title" x="1194" y="696">Ministries and auditors</text>
  <text class="box-text" x="1194" y="718">Procurement, tax, justice, review</text>

  <rect class="box external" x="1170" y="758" width="330" height="42"/>
  <text class="box-title" x="1194" y="776">Civic institutions</text>
  <text class="box-text" x="1194" y="794">Municipalities, schools, NGOs, clubs</text>

