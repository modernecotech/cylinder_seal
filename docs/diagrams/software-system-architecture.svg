  <text class="box-title" x="759" y="476">cs-consensus</text>
  <text class="box-text" x="759" y="498">Raft concepts and finality boundary</text>

  <rect class="box runtime" x="470" y="550" width="210" height="72"/>
  <text class="box-title" x="494" y="578">cs-credit</text>
  <text class="box-text" x="494" y="600">Cash-flow score features</text>

  <rect class="box runtime" x="735" y="550" width="260" height="72"/>
  <text class="box-title" x="759" y="578">cs-storage</text>
  <text class="box-text" x="759" y="600">Ledger persistence and sidecars</text>

  <rect class="box runtime" x="470" y="652" width="210" height="72"/>
  <text class="box-title" x="494" y="680">cbi-dashboard</text>
  <text class="box-text" x="494" y="702">Operator UI, sessions, roles</text>

  <rect class="box runtime" x="735" y="652" width="260" height="72"/>
  <text class="box-title" x="759" y="680">cs-analytics</text>
