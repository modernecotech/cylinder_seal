  <rect class="bg" width="1600" height="1100"/>
  <text class="title" x="56" y="58">Cylinder Seal Software System Architecture</text>
  <text class="subtitle" x="56" y="88">Prototype modules, data stores, and production integrations required for real Digital IQD infrastructure.</text>

  <rect class="zone user-zone" x="50" y="130" width="330" height="670"/>
  <text class="zone-title" x="78" y="168">User and merchant surfaces</text>
  <text class="zone-note" x="78" y="192">Wallets and payment endpoints</text>

  <rect class="box user" x="84" y="230" width="260" height="76"/>
  <text class="box-title" x="108" y="258">Citizen wallet</text>
  <text class="box-text" x="108" y="282">Android, iOS, Flutter</text>

  <rect class="box user" x="84" y="332" width="260" height="76"/>
  <text class="box-title" x="108" y="360">Individual producer</text>
  <text class="box-text" x="108" y="384">Informal-worker wallet track</text>

  <rect class="box user" x="84" y="434" width="260" height="76"/>
  <text class="box-title" x="108" y="462">Merchant POS</text>
  <text class="box-text" x="108" y="486">QR, NFC, BLE, local queue</text>

  <rect class="box user" x="84" y="536" width="260" height="76"/>
  <text class="box-title" x="108" y="564">Bank / lender portal</text>
  <text class="box-text" x="108" y="588">Future integration surface</text>

  <rect class="box user" x="84" y="638" width="260" height="76"/>
  <text class="box-title" x="108" y="666">CBI operator browser</text>
  <text class="box-text" x="108" y="690">Dashboard and control plane</text>

