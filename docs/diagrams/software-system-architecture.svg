<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder Seal Software System Architecture</title>
  <desc id="desc">Architecture diagram showing user surfaces, prototype runtime modules, data stores, and external production integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475467; }
      .zone-title { font: 700 19px Arial, sans-serif; fill: #101828; }
      .zone-note { font: 400 13px Arial, sans-serif; fill: #667085; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #101828; }
      .box-text { font: 400 12px Arial, sans-serif; fill: #344054; }
      .small { font: 400 11px Arial, sans-serif; fill: #475467; }
      .zone { stroke-width: 2; rx: 18; }
      .user-zone { fill: #eef6ff; stroke: #2e73b8; }
      .runtime-zone { fill: #edf7f0; stroke: #2f7d45; }
      .store-zone { fill: #fff7e6; stroke: #b26a00; }
      .external-zone { fill: #f4f4f5; stroke: #71717a; stroke-dasharray: 8 6; }
      .box { stroke-width: 1.5; rx: 10; }
      .user { fill: #ffffff; stroke: #2e73b8; }
      .runtime { fill: #ffffff; stroke: #2f7d45; }
      .partial { fill: #fff8e1; stroke: #b26a00; }
      .store { fill: #ffffff; stroke: #b26a00; }
      .external { fill: #ffffff; stroke: #71717a; stroke-dasharray: 6 5; }
      .arrow { stroke: #344054; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #667085; stroke-width: 1.8; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 7 5; }
      .legend { fill: #ffffff; stroke: #d0d5dd; rx: 12; }
    </style>
